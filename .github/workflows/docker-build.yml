name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'start-models.sh'
      - 'README.md'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'   # weekly rebuild, Mondays 09:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # TWEAK B: Free up disk space before building heavy ML images
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: jhsuai/vast-comfyui-h3:latest
          push: true
          build-args: |
            CACHEBUST=${{ github.run_id }}
          cache-from: type=registry,ref=jhsuai/vast-comfyui-h3:latest
          cache-to: type=inline
          compression: zstd
          compression-level: 3
          force-compression: true